name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]

    defaults:
      run:
        working-directory: EA1

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar que los módulos compilen
        run: python -m compileall -q src tests

      - name: Pruebas unitarias y de artefactos
        run: python -m unittest discover -s tests -v

  cuaderno-ae3:
    name: Cuaderno AE3 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar el cuaderno de AE3 de principio a fin
        working-directory: AE3
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: jupyter nbconvert --to notebook --execute --inplace Gonzalez_Jesus_AE3.ipynb

      - name: Verificar que los archivos se regeneraron
        working-directory: AE3
        shell: bash
        run: |
          test -f datos/dataset_preparado.csv
          test -f resultados/resumen_dataset_ae3.txt
          echo "Tablas de resultados: $(ls resultados/tabla_*.csv | wc -l)"
          test "$(ls resultados/tabla_*.csv | wc -l)" -eq 5
          echo "Archivos regenerados por la ejecución del cuaderno: OK"
